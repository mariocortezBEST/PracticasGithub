<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda de Artículos de Pesca</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Tienda de Pesca</h1>
        <nav>
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Productos</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <section class="banner">
        <h2>Todo para tus aventuras de pesca</h2>
    </section>

    <section class="productos">
        <h2>Nuestros Productos</h2>
        <div class="product-list">
            <div class="product-item">
                <img src="https://via.placeholder.com/150" alt="Caña de Pescar">
                <h3>Caña de Pescar</h3>
                <p>Precio: $50</p>
                <button class="add-to-cart">Añadir al carrito</button>
            </div>
            <div class="product-item">
                <img src="https://via.placeholder.com/150" alt="Anzuelo">
                <h3>Anzuelo</h3>
                <p>Precio: $5</p>
                <button class="add-to-cart">Añadir al carrito</button>
            </div>
            <div class="product-item">
                <img src="https://via.placeholder.com/150" alt="Cebo">
                <h3>Cebo</h3>
                <p>Precio: $10</p>
                <button class="add-to-cart">Añadir al carrito</button>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2024 Tienda de Pesca. Todos los derechos reservados.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
